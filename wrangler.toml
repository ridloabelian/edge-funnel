name = "edge-funnel"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[dev]
ip = "127.0.0.1"
port = 8792
inspector_port = 9292

[vars]
DEFAULT_WORKSPACE_SLUG = "saif-growth"
USD_TO_IDR_RATE = "16000"

[[d1_databases]]
binding = "DB"
database_name = "edge-funnel-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["15 0 * * *", "0 */6 * * *"]
